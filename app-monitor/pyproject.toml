[project]
name = "goofish-app-monitor"
version = "0.3.4"
description = "Mac 闲鱼 App 捡漏监控：每日报价驱动的自动搜索、地区筛选与推送"
requires-python = ">=3.10"
dependencies = [
  "appium-python-client>=5.2,<6",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<12",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
app-monitor = "app_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
